<div class="field {{ extra_class }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <b class="req">*</b>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="help">{{ field.help_text }}</small>{% endif %}
  {% for error in field.errors %}<small class="err">{{ error }}</small>{% endfor %}
</div>
